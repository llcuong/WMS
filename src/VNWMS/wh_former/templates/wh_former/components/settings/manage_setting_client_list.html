<tr id="setting-row-{{ s.id }}">
    <td style="border: none; padding: 0;"><div style="color: #404040; border: 2px solid #007bff; border-top-left-radius: 8px; border-bottom-left-radius: 8px; padding: 2px; height: 31px; text-align: center;">{{ s.client_ip }}</div></td>
    <td style="border: none; padding: 0;"><div style="color: #404040; border: 2px solid #007bff; border-left: none; padding: 2px; height: 31px; text-align: center;">{{ s.gate_name }}</div></td>
    <td style="border: none; padding: 0;"><div style="color: #404040; border: 2px solid #007bff; border-left: none; padding: 2px; height: 31px; text-align: center;">{{ s.rfid_controller_ip }}</div></td>
    <td style="border: none; padding: 0;"><div style="color: #404040; border: 2px solid #007bff; border-left: none; border-top-right-radius: 8px; border-bottom-right-radius: 8px; padding: 2px; height: 31px; text-align: center;">{{ s.port }}</div></td>
    <td style="border: none; padding-top: 0px !important;">
        <a href="{% url 'manage_wh_former_edit_client' s.id %}" class="btn btn-sm btn-outline-primary" style="width: 33px;"><i class="fas fa-edit"></i></a>
        <a href="{% url 'manage_wh_former_delete_client' s.id %}" class="btn btn-sm btn-outline-danger" style="width: 33px;"><i class="fas fa-times"></i></a>
        <a href="{% url 'manage_wh_former_connection_test_client' s.id %}" class="btn btn-sm btn-outline-warning test-connection" style="width: 33px;"><i class="fas fa-sync"></i></a>
        {% with active=s.rfif_setting_active_id %}
            <form method="post" action="{% url 'manage_wh_former_power_client' s.id %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit"
                    class="btn btn-sm {% if s.rfif_setting_active_id.rfid_power_on %}btn-success{% else %}btn-danger{% endif %}" style="width: 33px;">
                    <i class="fas fa-power-off"></i>
                </button>
            </form>
        {% endwith %}
    </td>
</tr>
