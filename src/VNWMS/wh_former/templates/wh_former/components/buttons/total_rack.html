
<style>
    .total-rack-button {
        outline: none;
        cursor: pointer;
        border: none;
        padding: 4px 12px;
        margin: 0;
        font-family: inherit;
        font-size: inherit;
        position: relative;
        display: inline-block;
        letter-spacing: 0.05rem;
        font-weight: 700;
        font-size: 16px;
        border-radius: 500px;
        overflow: hidden;
        background: #66ff66;
        color: ghostwhite;
    }

    .total-rack-button span {
        position: relative;
        z-index: 10;
        transition: color 0.4s;
    }

    .total-rack-button:hover span {
        color: black;
    }

    .total-rack-button::before,
    .total-rack-button::after {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
    }

    .total-rack-button::before {
        content: "";
        background: #000;
        width: 120%;
        left: -10%;
        transform: skew(30deg);
        transition: transform 0.4s cubic-bezier(0.3, 1, 0.8, 1);
    }

    .total-rack-button:hover::before {
        transform: translate3d(100%, 0, 0);
    }
</style>

<button class="total-rack-button">
    <span>Total</span>
</button>
