{% load i18n %}

<style>
    .save-button {
        min-width: 110px;
        font-family: inherit;
        font-size: 17px;
        background:  #007bff;
        color: white;
        padding: 4px 18px;
        display: flex;
        align-items: center;
        border: none;
        border-radius: 0.5em;
        overflow: hidden;
        transition: all 0.2s;
        cursor: pointer;
    }

    .save-button:disabled {
        background: #6c757d;
        cursor: not-allowed;
        opacity: 0.6;
    }

    .save-button:disabled:hover .svg-wrapper {
        animation: none;
    }

    .save-button:disabled:hover svg {
        transform: none;
    }

    .save-button:disabled:hover span {
        transform: none;
    }

    .save-button span {
        display: block;
        margin-left: 0.3em;
        transition: all 0.3s ease-in-out;
    }

    .save-button svg {
        display: block;
        transform-origin: center center;
        transition: transform 0.3s ease-in-out;
    }

    .save-button:hover .svg-wrapper {
        animation: fly-1 0.6s ease-in-out infinite alternate;
    }

    .save-button:hover svg {
        transform: translateX(1.2em) rotate(45deg) scale(1.1);
    }

    .save-button:hover span {
        transform: translateX(5em);
    }

    .save-button:active {
        transform: scale(0.95);
    }

    @keyframes fly-1 {
        from {
            transform: translateY(0.1em);
        }

        to {
            transform: translateY(-0.1em);
        }
    }

    .done-button {
        display: inline-block;
        transition: all 0.2s ease-in;
        position: relative;
        overflow: hidden;
        z-index: 1;
        color: #090909;
        padding: 8px 1.7em;
        cursor: pointer;
        font-size: 17px;
        border-radius: 0.5em;
        background: #e8e8e8;
        border: 1px solid #009087;
    }

    .done-button:active {
        color: #666;
    }

    .done-button:before {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%) scaleY(1) scaleX(1.25);
        top: 100%;
        width: 140%;
        height: 180%;
        background-color: rgba(0, 0, 0, 0.05);
        border-radius: 50%;
        display: block;
        transition: all 0.5s 0.1s cubic-bezier(0.55, 0, 0.1, 1);
        z-index: -1;
    }

    .done-button:after {
        content: "";
        position: absolute;
        left: 55%;
        transform: translateX(-50%) scaleY(1) scaleX(1.45);
        top: 180%;
        width: 160%;
        height: 190%;
        background-color: #009087;
        border-radius: 50%;
        display: block;
        transition: all 0.5s 0.1s cubic-bezier(0.55, 0, 0.1, 1);
        z-index: -1;
    }

    .done-button:hover {
        color: #ffffff;
        border: 1px solid #009087;
    }

    .done-button:hover:before {
        top: -35%;
        background-color: #009087;
        transform: translateX(-50%) scaleY(1.3) scaleX(0.8);
    }

    .done-button:hover:after {
        top: -45%;
        background-color: #009087;
        transform: translateX(-50%) scaleY(1.3) scaleX(0.8);
    }

    .cancel-button {
        width: 110px;
        height: 40px;
        cursor: pointer;
        display: flex;
        align-items: center;
        background: red;
        border: none;
        border-radius: 0.5em;
        box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.15);
    }

    .cancel-button, .cancel-button span {
        transition: 200ms;
    }

    .cancel-button .text {
        transform: translateX(18px);
        color: white;
        font-weight: bold;
    }

    .cancel-button .icon {
        position: absolute;
        border-left: 1px solid #c41b1b;
        transform: translateX(75px);
        height: 16px;
        width: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .cancel-button svg {
        width: 15px;
        fill: #eee;
    }

    .cancel-button:hover {
        background: #ff3636;
    }

    .cancel-button:hover .text {
        color: transparent;
    }

    .cancel-button:hover .icon {
        width: 110px;
        border-left: none;
        transform: translateX(0);
    }

    .cancel-button:focus {
        outline: none;
    }

    .cancel-button:active .icon svg {
        transform: scale(0.8);
    }
</style>

<div class="d-flex justify-content-center mt-2" style="gap: 20px;">
    {% if enable_form_validation %}
        {% if enable_save_button %}
            <button type="submit" name="form_type" value="former" id="saveButton" class="save-button">
        {% else %}
            <button type="submit" name="form_type" value="former" id="saveButton" class="save-button" disabled>
        {% endif %}
    {% elif enable_bin_validation %}
        <button type="submit" name="form_type" value="former" id="saveButton" class="save-button" disabled>
    {% else %}
        <button type="submit" name="form_type" value="former" id="saveButton" class="save-button">
    {% endif %}
        <div class="svg-wrapper-1">
            <div class="svg-wrapper">
                <svg
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 24 24"
                        width="16"
                        height="16"
                >
                    <path fill="none" d="M0 0h24v24H0z"></path>
                    <path
                            fill="currentColor"
                            d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z"
                    ></path>
                </svg>
            </div>
        </div>
        <span>{% trans "Save" %}</span>
    </button>

    {% if not template_hide_done_button %}
        <button type="submit" name="form_type" value="done" id="doneButton" class="done-button">
            <span class="text">{% trans "Done" %} !</span>
        </button>
    {% endif %}

    <button type="submit" name="form_type" value="cancel" class="cancel-button">
        <span class="text">{% trans "Cancel" %}</span>
        <span class="icon">
            <svg xmlns="http://www.w3.org/2000/svg"
                width="24" height="24" viewBox="0 0 24 24">
                <path d="M24 20.188l-8.315-8.209 8.2-8.282-3.697-3.697-8.212
                8.318-8.31-8.203-3.666 3.666 8.321 8.24-8.206 8.313 3.666
                3.666 8.237-8.318 8.285 8.203z"></path>
            </svg>
        </span>
    </button>
</div>
