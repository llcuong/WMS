{% load i18n %}

<div class="modal fade" id="binSelectionWarningModal" tabindex="-1" aria-labelledby="binSelectionWarningModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title" id="binSelectionWarningModalLabel">
                    <i class="fas fa-exclamation-triangle me-2"></i>{% trans "Bin Selection Required" %}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-warning mb-3">
                    <strong>{% trans "Warning:" %}</strong> {% trans "Some baskets do not have bins selected." %}
                </div>
                <div id="missingBinsList" class="mb-3">
                    <!-- Will be populated by JavaScript -->
                </div>
                <p class="text-muted">
                    <i class="fas fa-info-circle me-1"></i>
                    {% trans "Please select bins for all baskets before saving, or click Continue to save without bin selection." %}
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="binModalCancel">
                    <i class="fas fa-times me-1"></i>{% trans "Cancel" %}
                </button>
                <button type="button" class="btn btn-warning" id="binModalContinue">
                    <i class="fas fa-check me-1"></i>{% trans "Continue Anyway" %}
                </button>
            </div>
        </div>
    </div>
</div>
