{% load i18n %}
<span class="text">{% trans "Confirm" %}</span>
<span class="icon">
    <svg
        viewBox="0 0 24 24"
        height="24"
        width="24"
        xmlns="http://www.w3.org/2000/svg">
      <path d="M9.707 19.121a.997.997 0 0 1-1.414 0l-5.646-5.647a1.5 1.5 0 0 1 0-2.121l.707-.707a1.5 1.5 0 0 1 2.121 0L9 14.171l9.525-9.525a1.5 1.5 0 0 1 2.121 0l.707.707a1.5 1.5 0 0 1 0 2.121z">
      </path>
    </svg>
</span>


<style>
    .confirm-button-2 {
        width: 150px;
        height: 42px;
        cursor: pointer;
        display: flex;
        align-items: center;
        border: none;
        border-radius: 5px;
        box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.15);
        background: #00a600;
    }

    .confirm-button-2,
    .confirm-button-2 span {
        transition: 200ms;
    }

    .confirm-button-2 .text {
        transform: translateX(35px);
        color: white;
        font-weight: bold;
    }

    .confirm-button-2 .icon {
        position: absolute;
        border-left: 1px solid white;
        transform: translateX(110px);
        height: 40px;
        width: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .confirm-button-2 svg {
        width: 20px;
        fill: #eee;
    }

    .confirm-button-2:hover {
        background:  #00a600;
    }

    .confirm-button-2:hover .text {
        color: transparent;
    }

    .confirm-button-2:hover .icon {
        width: 150px;
        border-left: none;
        transform: translateX(0);
    }

    .confirm-button-2:focus {
        outline: none;
    }

    .confirm-button-2:active .icon svg {
        transform: scale(0.8);
    }
</style>
