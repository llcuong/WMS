{% load i18n %}

{#{% if form_type %}#}
    <button type="submit" name="form_type" value="cancel" class="cancel-button">
{#{% else %}#}
{#    <button type="button" class="cancel-button" data-bs-toggle="modal" data-bs-target="#cancelModal">#}
{#{% endif %}#}
        <span class="cancel-text">{% trans "Cancel" %}</span>
        <span class="icon">
            <svg xmlns="http://www.w3.org/2000/svg"
                width="24" height="24" viewBox="0 0 24 24">
                <path d="M24 20.188l-8.315-8.209 8.2-8.282-3.697-3.697-8.212
                8.318-8.31-8.203-3.666 3.666 8.321 8.24-8.206 8.313 3.666
                3.666 8.237-8.318 8.285 8.203z"></path>
            </svg>
        </span>
    </button>

<style>
    .cancel-button {
        width: 110px;
        height: 40px;
        cursor: pointer;
        display: flex;
        align-items: center;
        background: red;
        border: none;
        border-radius: 0.5em;
        box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.15);
    }

    .cancel-button, .cancel-button span {
        transition: 200ms;
    }

    .cancel-button .cancel-text {
        transform: translateX(18px);
        color: white;
        font-weight: bold;
    }

    .cancel-button .icon {
        position: absolute;
        border-left: 1px solid #c41b1b;
        transform: translateX(75px);
        height: 16px;
        width: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .cancel-button svg {
        width: 15px;
        fill: #eee;
    }

    .cancel-button:hover {
        background: #ff3636;
    }

    .cancel-button:hover .cancel-text {
        color: transparent;
    }

    .cancel-button:hover .icon {
        width: 110px;
        border-left: none;
        transform: translateX(0);
    }

    .cancel-button:focus {
        outline: none;
    }

    .cancel-button:active .icon svg {
        transform: scale(0.8);
    }
</style>
