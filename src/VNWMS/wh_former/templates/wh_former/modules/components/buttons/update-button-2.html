</span>

<style>
    .update-button-2 {
        width: 150px;
        height: 42px;
        cursor: pointer;
        display: flex;
        align-items: center;
        border: none;
        border-radius: 5px;
        box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.15);
        background: #007bff;
    }

    .update-button-2, .update-button-2 span {
        transition: 200ms;
    }

    .update-button-2 .text {
        transform: translateX(35px);
        color: white;
        font-weight: bold;
    }

    .update-button-2 .icon {
        position: absolute;
        border-left: 1px solid white;
        transform: translateX(110px);
        height: 40px;
        width: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .update-button-2 svg {
        width: 23px;
        fill: #eee;
    }

    .update-button-2:hover {
        background: #007bff;
    }

    .update-button-2:hover .text {
        color: transparent;
    }

    .update-button-2:hover .icon {
        width: 150px;
        border-left: none;
        transform: translateX(0);
    }

    .update-button-2:focus {
        outline: none;
    }

    .update-button-2:active .icon svg {
        transform: scale(0.8);
    }
</style>
