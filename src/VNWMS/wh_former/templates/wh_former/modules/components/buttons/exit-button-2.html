{% load i18n %}
<span class="text">{% trans "Exit" %}</span>
<span class="icon">
    <i class="fas fa-sign-out-alt" style="color: black"></i>
</span>

<style>
    .exit-button-2 {
        width: 150px;
        height: 42px;
        cursor: pointer;
        display: flex;
        align-items: center;
        border: none;
        border-radius: 5px;
        box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.15);
        background: #ffc107;
    }

    .exit-button-2, .exit-button-2 span {
        transition: 200ms;
    }

    .exit-button-2 .text {
        transform: translateX(35px);
        color: black;
        font-weight: bold;
    }

    .exit-button-2 .icon {
        position: absolute;
        border-left: 1px solid black;
        transform: translateX(110px);
        height: 24px;
        width: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .exit-button-2 svg {
        width: 15px;
        fill: #eee;
    }

    .exit-button-2:hover {
        background: #f8c02f;
    }

    .exit-button-2:hover .text {
        color: transparent;
    }

    .exit-button-2:hover .icon {
        width: 150px;
        border-left: none;
        transform: translateX(0);
    }

    .exit-button-2:focus {
        outline: none;
    }

    .exit-button-2:active .icon svg {
        transform: scale(0.8);
    }
</style>
