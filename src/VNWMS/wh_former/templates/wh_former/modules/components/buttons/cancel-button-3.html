{% load i18n %}

<button type="button" onclick="window.isNavigatingAway = true; window.location.replace('{% url 'basket_insert' %}');" class="button buttonfff" id="basketCancelButton">
    <span class="button__icon-wrapperfff">
    🖌
  </span>
    {% trans "Exit" %}
</button>


<style>
    .buttonfff {
        line-height: 1;
        text-decoration: none;
        display: inline-flex;
        border: none;
        cursor: pointer;
        align-items: center;
        gap: 0.75rem;
        background-color: #2272F4;
        color: white;
        border-radius: 0.5em;
        font-weight: 600;
        padding: 4px 18px;
        padding-left: 20px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: background-color 0.3s;
    }

    .button__icon-wrapperfff {
        flex-shrink: 0;
        width: 25px;
        height: 25px;
        position: relative;
        color: #2272F4;
        background-color: #fff;
        border-radius: 50%;
        display: grid;
        place-items: center;
        overflow: hidden;
    }

    .buttonfff:hover {
        background-color: #6c757d;
    }

    .buttonfff:hover .button__icon-wrapperfff {
        color: #6c757d;
    }

    .button__icon-svg--copyfff {
        position: absolute;
        transform: translate(150%, 150%);
    }

    .buttonfff:hover .button__icon-svgfff:first-child {
        transition: transform 0.3s ease-in-out;
        transform: translate(-150%, -150%);
    }

    .buttonfff:hover .button__icon-svg--copyfff {
        transition: transform 0.3s ease-in-out 0.1s;
        transform: translate(0);
    }
</style>
