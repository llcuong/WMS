{% load i18n %}
<span class="text">{% trans "Delete all" %}</span>
<span class="icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
        <path d="M7 4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2h4a1 1 0 1 1 0 2h-1.069l-.867 12.142A2 2 0 0 1 17.069 22H6.93a2 2 0 0 1-1.995-1.858L4.07 8H3a1 1 0 0 1 0-2h4V4zm2 2h6V4H9v2zM6.074 8l.857 12H17.07l.857-12H6.074zM10 10a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0v-6a1 1 0 0 1 1-1zm4 0a1 1 0 0 1 1 1v6a1 1 0 1 1-2 0v-6a1 1 0 0 1 1-1z"  style="fill: rgb(254,255,246);"/>

</span>

<style>
    .delete-button-2 {
        width: 150px;
        height: 42px;
        cursor: pointer;
        display: flex;
        align-items: center;
        border: none;
        border-radius: 5px;
        box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.15);
        background: #e62222;
    }

    .delete-button-2, .cancel-button-2 span {
        transition: 200ms;
    }

    .delete-button-2 .text {
        transform: translateX(35px);
        color: white;
        font-weight: bold;
    }

    .delete-button-2 .icon {
        position: absolute;
        border-left: 1px solid white;
        transform: translateX(110px);
        height: 40px;
        width: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .delete-button-2 svg {
        width: 26px;
        fill: #eee;
    }

    .cancel-button-2:hover {
        background: #ff3636;
    }

    .delete-button-2:hover .text {
        color: transparent;
    }

    .delete-button-2:hover .icon {
        width: 150px;
        border-left: none;
        transform: translateX(0);
    }

    .delete-button-2:focus {
        outline: none;
    }

    .delete-button-2:active .icon svg {
        transform: scale(0.8);
    }
</style>
