            <svg viewBox="0 0 24 24" height="24" width="24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9.145 18.29c-5.042 0-9.145-4.102-9.145-9.145s4.103-9.145 9.145-9.145 9.145
                4.103 9.145 9.145-4.102 9.145-9.145 9.145zm0-15.167c-3.321 0-6.022 2.702-6.022 6.022s2.702
                6.022 6.022 6.022 6.023-2.702 6.023-6.022-2.702-6.022-6.023-6.022zm9.263 12.443c-.817
                1.176-1.852 2.188-3.046 2.981l5.452 5.453 3.014-3.013-5.42-5.421z"></path>
            </svg>
        </span>
    </button>
</div>

<script>
    function showLoadingModal() {
        const modal = new bootstrap.Modal(document.getElementById('loadingModal'));
        modal.show();
    }
</script>

<style>
    .search-button-wrapper {
        display: flex;
        justify-content: center;
        height: 100%;
        margin: 8px auto;
    }

    .button {
        position: relative;
        background-color: white;
        color: #212121;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 48px !important;
        width: 48px;
        height: 48px;
        font-size: 20px;
        font-weight: 600;
        gap: 10px;
        border: 1px solid #007bff;
        border-radius: 0.5rem;
        transition: all 0.6s cubic-bezier(0.23, 1, 0.320, 1);
        cursor: pointer;
        overflow: hidden;
    }

    .button span {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
    }

    .button::before {
        content: "";
        position: absolute;
        background-color: #007bff;
        width: 100%;
        height: 100%;
        left: 0%;
        bottom: 0%;
        transform: translate(-100%, 100%);
        border-radius: 0.5rem;
    }

    .button svg {
        fill: #007bff;
        transition: all 0.6s cubic-bezier(0.23, 1, 0.320, 1);
    }

    .button:hover::before {
        animation: shakeBack 0.6s forwards;
    }

    .button:hover svg {
        fill: white;
        scale: 1.3;
    }

    .button:active {
        box-shadow: none;
    }

    @keyframes shakeBack {
        0% {
            transform: translate(-100%, 100%);
        }

        50% {
            transform: translate(20%, -20%);
        }

        100% {
            transform: translate(0%, 0%);
        }
    }
</style>
