{% load i18n %}

<button class="done-button" id="doneButton" >
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
         class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12h15m0 0l-6.75-6.75M19.5 12l-6.75 6.75"></path>
    </svg>

    <div class="done-text">
        {% trans "Save" %}
    </div>
</button>

<style>
    .done-button {
        background-color: #3654ff;
        color: #fff;
        min-width: 110px;
        height: 40px;
        border: none;
        border-radius: 0.5em;
        text-align: right;
        transition: all 0.6s ease;
    }

    .done-button:hover:not(:disabled):not(.btn-disabled) {
        background-color: #3654ff;
        color: #fff;
        cursor: pointer;
    }

    .done-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background-color: #6c757d;
        color: white;
    }

    .done-button svg {
        width: 1.6em;
        margin: -0.2em 0.8em 1em;
        position: absolute;
        display: flex;
        transition: all 0.6s ease;
    }

    .done-button:hover:not(:disabled):not(.btn-disabled) svg {
        transform: translateX(5px);
    }

    .done-text {
        margin: 0 1.5em;
        font-weight: bold;
    }
</style>
