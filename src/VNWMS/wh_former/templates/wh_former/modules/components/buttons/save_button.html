{% load i18n %}

<button type="{% if basket %}button{% else %}submit{% endif %}" name="form_type" value="former" id="saveButton" class="save-button">
    <div class="svg-wrapper-1">
        <div class="svg-wrapper">
            <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    width="16"
                    height="16"
            >
                <path fill="none" d="M0 0h24v24H0z"></path>
                <path
                        fill="currentColor"
                        d="M1.946 9.315c-.522-.174-.527-.455.01-.634l19.087-6.362c.529-.176.832.12.684.638l-5.454 19.086c-.15.529-.455.547-.679.045L12 14l6-8-8 6-8.054-2.685z"
                ></path>
            </svg>
        </div>
    </div>
    <span>{% trans "Add" %}</span>
</button>
{% if not basket %}
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const saveButton = document.getElementById('saveButton');
            if (saveButton) {
                saveButton.addEventListener('click', function(e) {
                    if (typeof collectTableData === 'function') {
                        collectTableData([1], [2]);
                    }
                });
            }
        });

        window.updateSubmitButtons = function() {
            const saveButton = document.getElementById('saveButton');
            if (!saveButton) return;

            let fieldsOk = true;
            let binsOk = true;

            {% if type != "empty" %}
                fieldsOk = (typeof checkAllFieldsFilled === 'function') ? checkAllFieldsFilled() : true;
                binsOk = (typeof checkAllBinSelected === 'function') ? checkAllBinSelected() : true;
            {% endif %}

            if (fieldsOk && binsOk) {
                saveButton.disabled = false;
                saveButton.classList.remove('btn-disabled');
            } else {
                saveButton.disabled = true;
                saveButton.classList.add('btn-disabled');
            }
        };
    </script>
{% endif %}
<style>
    .save-button {
        min-width: 110px;
        font-family: inherit;
        font-size: 17px;
        background:  #007bff;
        color: white;
        padding: 4px 18px;
        display: flex;
        align-items: center;
        border: none;
        border-radius: 0.5em;
        overflow: hidden;
        transition: all 0.2s;
        cursor: pointer;
        height: 40px;
    }

    .save-button:disabled {
        background: #6c757d;
        cursor: not-allowed;
        opacity: 0.6;
    }

    .save-button:disabled:hover .svg-wrapper {
        animation: none;
    }

    .save-button:disabled:hover svg {
        transform: none;
    }

    .save-button:disabled:hover span {
        transform: none;
    }

    .save-button span {
        display: block;
        margin-left: 0.3em;
        transition: all 0.3s ease-in-out;
    }

    .save-button svg {
        display: block;
        transform-origin: center center;
        transition: transform 0.3s ease-in-out;
    }

    .save-button:hover .svg-wrapper {
        animation: fly-1 0.6s ease-in-out infinite alternate;
    }

    .save-button:hover svg {
        transform: translateX(1.2em) rotate(45deg) scale(1.1);
    }

    .save-button:hover span {
        transform: translateX(5em);
    }

    .save-button:active {
        transform: scale(0.95);
    }

    @keyframes fly-1 {
        from {
            transform: translateY(0.1em);
        }

        to {
            transform: translateY(-0.1em);
        }
    }
</style>
