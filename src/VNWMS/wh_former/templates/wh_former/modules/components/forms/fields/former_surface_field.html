{% load i18n %}

<label for="surface_name_input" class="form-label">{% trans "Surface" %}{% if is_required %}<span class="">*</span>{% endif %}</label>

<div class="custom-select-wrapper position-relative">
    <input type="text" id="surface_name_input" name="params_surface" class="select-input form-control"
           placeholder='{% trans "Select..." %}' autocomplete="off"
           value="{{ former_surface|default:'' }}"
           {% if is_required %}required{% endif %}>

    <span class="x-button position-absolute" style="right: {% if add %}35{% else %}10{% endif %}px"
          onclick="document.getElementById('surface_name_input').value = '';">
        &times;
    </span>

    {% if add %}
        <span class="x-button position-absolute end-0 me-2"
              onclick="$('#surfaceModal').modal('show')">
            <i class="fa-solid fa-circle-plus fa-sm me-1"></i>
        </span>
    {% endif %}

    <div id="surface_dropdown" class="select-dropdown"></div>
</div>

{% for error in form.vendor_name.errors %}
    <div class="text-danger">{{ error }}</div>
{% endfor %}

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const surfaceOptions = [
            {% for name in form.params_surface_list %}
                "{% translate name as tname %}{{ tname|escapejs }}"{% if not forloop.last %}, {% endif %}
            {% endfor %}
        ];
        initDropdown("surface_name_input", "surface_dropdown", surfaceOptions);
    });
</script>
