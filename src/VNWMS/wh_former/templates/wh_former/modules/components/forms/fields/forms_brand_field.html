{% load i18n %}

<label for="vendor_name_input" class="form-label">{% trans "Brand" %}{% if is_required %}<span class="">*</span>{% endif %}</label>

<div class="custom-select-wrapper position-relative">
    <input type="text" id="vendor_name_input" name="vendor_name" class="select-input form-control"
       placeholder="{% trans 'Select or Typing' %}..." autocomplete="off"
       value="{{ former_vendor|default:'' }}"
       {% if is_required %}required{% endif %}>

    <span class="x-button position-absolute" style="right: {% if add and is_wh_former_admin %}35{% else %}10{% endif %}px"
          onclick="document.getElementById('vendor_name_input').value = '';">
        &times;
    </span>

    {% if add and is_wh_former_admin %}
        <span class="x-button position-absolute end-0 me-2"
              onclick="$('#vendorModal').modal('show')">
            <i class="fa-solid fa-circle-plus fa-sm me-1"></i>
        </span>
    {% endif %}

    <div id="vendor_dropdown" class="select-dropdown"></div>
</div>

{% for error in form.vendor_name.errors %}
    <div class="text-danger">{{ error }}</div>
{% endfor %}

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const vendorOptions = [
            {% for name in form.vendor_name_list %}
                "{{ name|escapejs }}"{% if not forloop.last %}, {% endif %}
            {% endfor %}
        ];
        initDropdown("vendor_name_input", "vendor_dropdown", vendorOptions);
    });
</script>
