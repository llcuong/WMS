{% load i18n %}

<style>
    .loading-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #007bff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .loading-modal-content {
        border: none !important;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1) !important;
    }

    .loading-modal-body {
        padding: 40px 20px !important;
    }

    .loading-text {
        color: #6c757d;
        font-size: 18px;
        margin-top: 20px;
    }

    .loading-backdrop {
        background-color: rgba(0, 0, 0, 0.5) !important;
        z-index: 9999 !important;
    }
    
    #loadingModal {
        z-index: 10000 !important;
    }
</style>

<div class="modal fade loading-backdrop" id="loadingModal" tabindex="-1" aria-labelledby="loadingModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 300px;">
        <div class="modal-content loading-modal-content" style="border-radius: 20px;">
            <div class="modal-body text-center loading-modal-body">
                <div class="loading-spinner mx-auto"></div>
                <div class="loading-text">
                    <p class="mb-0 font-weight-bold">{% trans "Loading..." %}</p>
                    <small class="text-muted">{% trans "Please wait" %}</small>
                </div>
            </div>
        </div>
    </div>
</div>
