<div class="modal fade" id="confirmationModal" tabindex="-1" role="dialog" aria-labelledby="confirmationModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-primary font-weight-bold" id="confirmationModalLabel">{% trans "Confirm the following basket infomation" %}</h5>
                <button type="button" class="close" onclick="$('#confirmationModal').modal('hide')" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <div id="confirmationContent">
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="sr-only">Loading...</span>
                        </div>
                        <p class="mt-2">{% trans "Loading form data..." %}</p>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="cancel-button-2" onclick="$('#confirmationModal').modal('hide')">
                    {% include 'wh_former/modules/components/buttons/cancel-button-2.html' %}
                </button>
                <button type="button" class="confirm-button-2" id="confirmSave" disabled>
                    {% include 'wh_former/modules/components/buttons/confirm-button-2.html' %}
                </button>
            </div>
        </div>
    </div>
</div>
