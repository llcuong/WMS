{% load i18n %}

<style>
    .custom-bounce {
        --fa-animation-duration: 2s;
        --fa-animation-iteration-count: 1;
    }
</style>

<div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 380px;">
        <div class="modal-content" style="border-radius: 20px;">
            <div class="modal-body text-center text-success font-weight-bold fs-18">
                <div class="mt-4">
                    <i class="fas fa-check-circle fa-3x mb-2 fa-bounce custom-bounce"></i>
                </div>
                <div class="mt-3">
                    <p class="text-dark font-weight-bold" style="font-size: 28px">{% trans "Success" %}</p>
                </div>
                <div class="mt-3">
                    <button class="btn btn-success px-4" onclick="$('#successModal').modal('hide')">
                        {% trans "OK" %}
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

{% if success_modal %}
    <script>
        $(document).ready(function () {
            if (typeof hideLoadingModal === 'function') {
                hideLoadingModal();
            } else {
                const loadingModalElement = document.getElementById('loadingModal');
                if (loadingModalElement) {
                    const loadingModal = bootstrap.Modal.getInstance(loadingModalElement);
                    if (loadingModal) {
                        loadingModal.hide();
                    }
                }
            }
            
            setTimeout(() => {
                $('#successModal').modal('show');
            }, 200);

            setTimeout(() => {
                $('#successModal').modal('hide');
            }, 2000);
        });
    </script>
{% endif %}
