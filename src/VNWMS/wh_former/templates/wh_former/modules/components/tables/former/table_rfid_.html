<style>
    .rfidBtn{
        min-width: 156px;
        height: 38px;
        outline: none !important;
        color: #363530;
        font-weight: bold;
        background-color: #EFEFEF;
        border: 2px solid #EFEFEF;
        border-radius: 4px;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        letter-spacing: 0.06rem;
    }

    .rfidBtn.active {
        border-radius: 4px;
        color: white;
        background-color: #3b49e7;
        outline: none !important;
        border: 2px solid #3b49e7;
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
        font-weight: bold;
    }

    .rfid-table-container{
        padding: 10px 12px;
        background-color: #EFEFEF;
        border-radius: 16px;
        border: 3px solid #3b49e7;
    }

    .rfid-table-content{
        display: flex;
        align-items: flex-start;
        gap: 10px !important;
    }

    .rfid-table-controller-container {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
        gap: 10px;
    }

    .rfid-table-controller{
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px 10px;
        border-radius: 12px;
        background-color: white;
    }

    .rfid-table-result-container, .rfid-manual-table-result-container{
        background-color: white;
        border-radius: 12px;
        min-height: 260px;
        border: 2px solid white;
        position: relative; /* Thêm dòng này */
    }

    .rfid-table-result-header-container{
        width: 100%;
        padding: 10px 0 0 0;
    }

    .rfid-table-result, .rfid-manual-table-result{
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-size: 16px;
        background-color: white;
    }

    .rfid-table-result-footer-container{
        font-size: 15px;
        color: #333;
        text-align: right;
        padding: 5px 15px;
        height: 33px !important;
        border-top: 2px solid #EFEFEF;
    }
</style>

<style>
    .lock-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(51, 51, 51, 0.8);
        z-index: 10;
        color: white;
        font-size: 32px;
        border-radius: 8px;
        pointer-events: auto;
    }
</style>

<style>
    /* Loading overlay styles */
    .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        border-radius: 12px;
    }

    .loading-overlay.show {
        display: flex;
    }

    .loading-content {
        text-align: center;
        color: white;
    }

    .loading-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #3b49e7;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }
        100% {
            transform: rotate(360deg);
        }
    }

    .loading-text {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .loading-progress {
        font-size: 14px;
        opacity: 0.8;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const toggleButtons = document.querySelectorAll(".table-toggle-btn");
        toggleButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                const pid = btn.dataset.pid;

                document.querySelectorAll('[id^="rfid-table-wrapper-"]').forEach(div => {
                    div.style.display = "none";
                });

                const target = document.getElementById(`rfid-table-wrapper-${pid}`);
                if (target) {
                    target.style.display = "block";

                    const modal = document.querySelector('.custom-modal');
                    if (modal) {
                        modal.classList.remove("fade");
                        setTimeout(() => modal.classList.add("fade"), 10);
                    }
                }

                toggleButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");

                setTimeout(drawAreaMap, 150);
            });
        });
    });
</script>

<script>
    function collectTableData(pidsX5, pidsInput, stock) {
        let allRows = [];

        pidsX5.forEach(pid => {
            const rows = document.querySelectorAll(`#epc-table-body-${pid} tr`);
            rows.forEach(tr => {
                const tds = tr.querySelectorAll('td');
                if (tds.length >= 5) {
                    if (stock)
                        allRows.push({
                            basket_no: tds[1]?.innerText.trim() || '',
                            vendor_name: tds[2]?.innerText.trim() || '',
                            former_qty: tds[3]?.innerText.trim() || '0',
                            bin: tds[4]?.innerText.trim() || 'INIT'
                        });
                    else {
                        allRows.push({
                            basket_no: tds[1]?.innerText.trim() || '',
                            vendor_name: tds[2]?.innerText.trim() || '',
                            former_qty: tds[3]?.innerText.trim() || '',
                            bin: tds[4]?.innerText.trim() || ''
                    }   );
                    }
                }
            });
        });

        pidsInput.forEach(pid => {
            const rows = document.querySelectorAll(`#epc-table-body-${pid} tr`);
            rows.forEach(tr => {
                const tds = tr.querySelectorAll('td');
                const input = tr.querySelector('.stepper-input');
                if (tds.length >= 5) {
                    allRows.push({
                        basket_no: tds[1]?.innerText.trim() || '',
                        vendor_name: tds[2]?.innerText.trim() || '',
                        former_qty: input ? input.value : '0',
                        bin: tds[4]?.innerText.trim() || 'INIT'
                    });
                }
            });
        });

        const hiddenInput = document.getElementById("table-data-input");
        if (hiddenInput) {
            hiddenInput.value = JSON.stringify(allRows);
        }
    }

    function collectBatchData() {
        const summary = [];
        const rows = document.querySelectorAll("#stock-new-info-table tr");

        rows.forEach(row => {
            const cells = row.querySelectorAll("td");
            if (cells.length >= 5) {
                const batchNo = cells[0].innerText.trim();
                const basket = parseInt(cells[4].innerText.trim());
                const former = parseInt(cells[5].innerText.trim());
                const usedDay = parseInt(cells[3].innerText.trim());
                const size = cells[2]?.innerText.trim() || '';
                if (batchNo && !isNaN(basket) && !isNaN(former) && !isNaN(usedDay)) {
                    summary.push({ batch_no: batchNo, basket: basket, former: former, used: usedDay, size: size });
                }
            }
        });

        document.getElementById("batch-data-input").value = JSON.stringify(summary);
    }

    function collectLostData() {
        const summary = [];
        const rows = document.querySelectorAll("#batch-basket-lost tr");

        rows.forEach(row => {
            const cells = row.querySelectorAll("td");
            if (cells.length >= 3) {
                const basketNo = cells[0].innerText.trim();
                const former = parseInt(cells[1].innerText.trim());
                const bin = cells[2].innerText.trim();

                if (basketNo && !isNaN(former) && bin) {
                    summary.push({ basket_no: basketNo, former: former, bin: bin });
                }
            }
        });

        document.getElementById("table-lost-input").value = JSON.stringify(summary);
    }

    function collectWoData() {
        const summary = [];
        const rows = document.querySelectorAll("#wo-result-table tr");

        rows.forEach(row => {
            const cells = row.querySelectorAll("td");
            if (cells.length >= 3) {
                const line = cells[0].innerText.trim();
                const wo = parseInt(cells[1].innerText.trim());
                const size = cells[2].innerText.trim();

                if (line && wo && size) {
                    summary.push({ line: line, wo: wo, size: size });
                }
            } else {
                const line = cells[0].innerText.trim();
                const error = parseInt(cells[1].innerText.trim());

                if (line && error) {
                    summary.push({ line: line, error: error });
                }
            }
        });

        document.getElementById("table-wo-input").value = JSON.stringify(summary);
    }

    function collectNoBatchData() {
        const summary = [];
        const rows = document.querySelectorAll("#stockin-no-basket-table tr");

        rows.forEach(row => {
            const text = row.innerText.trim();
            if (text) {
                summary.push({ no_batch: text });
            }
        });

        document.getElementById("nobatch-data-input").value = JSON.stringify(summary);
    }
</script>

<script>
    window.addEventListener('beforeunload', function () {
        navigator.sendBeacon("{% url 'set_epc_is_passed' %}", JSON.stringify({
            pid: '{{ pid }}',
            client_ip: '{{ request.META.REMOTE_ADDR }}'
        }));
    });
</script>

<script>
    function setTableDataInput(pids) {
        const rows = pids.flatMap(pid =>
            [...document.querySelectorAll(`#epc-table-body-${pid} tr`)]
        );

        const tableData = rows.map(row => {
            const cells = row.querySelectorAll('td');
            return {
                epc_raw: row.dataset.epc || "",
                basket_no: cells[2]?.innerText.trim(),
                former_qty: parseInt(cells[3]?.querySelector('input')?.value || 0),
                bin: cells[4]?.innerText.trim() || "initial"
            };
        });
        document.getElementById('table-data-input').value = JSON.stringify(tableData);
    }
</script>

<script>
    window.totalBasketVal = 0;
    window.totalFormerVal = 0;
    const summaryInterval = setInterval(updateGlobalSummary, 500);

    function updateGlobalSummary() {
        let totalBasket = 0;
        let totalFormer = 0;

        document.querySelectorAll('[id^="epc-table-body-"]').forEach(tbody => {
            const resultRows = tbody.querySelectorAll('.result-table-tr');
            const manualRows = tbody.querySelectorAll('.result-manual-table-tr');
            totalBasket += resultRows.length + manualRows.length;

            resultRows.forEach(row => {
                const cell = row.children[3];
                const val = parseInt(cell.textContent.trim(), 10) || 0;
                totalFormer += val;
            });

            manualRows.forEach(row => {
                const input = row.querySelector('.stepper-input');
                totalFormer += parseInt(input?.value, 10) || 0;
            });
        });

        window.totalBasketVal = totalBasket;
        window.totalFormerVal = totalFormer;

        document.querySelectorAll('[id^="rfid-count-"]').forEach(el => {el.innerText = window.totalBasketVal;});
        document.querySelectorAll('[id^="total-count-"]').forEach(el => {el.innerText = window.totalFormerVal;});
    }
</script>
