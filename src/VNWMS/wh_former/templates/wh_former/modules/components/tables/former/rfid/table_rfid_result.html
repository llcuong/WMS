{% load i18n %}

<style>
    .rfid-table-counter {
        display: flex;
        flex-direction: column;
        padding: 2px 10px;
        border-radius: 12px;
        background-color: white;
    }


    .counter-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 17px;
        padding: 2px 0;
    }

    .counter-number {
        min-width: 40px;
        text-align: right;
        font-weight: bold;
        font-size: 18px;
    }
</style>

<div class="counter-row">
    <i class="fas fa-angle-right"></i>
    <span><b>{% trans "Former" %}:</b></span>
    <span class="counter-number text-danger" id="total-count-{{ pid }}">0</span>
</div>


<div class="counter-row">
    <i class="fas fa-angle-right"></i>
    <span><b>{% trans "Basket" %}:</b></span>
    <span class="counter-number text-success" id="rfid-count-{{ pid }}">0</span>
</div>
